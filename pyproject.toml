[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ctrl-v2"
version = "0.1.0"
description = "CTRL v2 Response Intelligence walking skeleton"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.111,<1",
  "openpyxl>=3.1,<4",
  "PyJWT[crypto]>=2.9,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "pypdf>=4.2,<7",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.9,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.5,<1",
]
research = [
  "huggingface-hub==0.23.4",
  "numpy==1.26.4",
  "openai==3.3.1",
  "psutil==7.0.0",
  "safetensors==0.4.3",
  "sentence-transformers==3.0.1",
  "torch==2.1.2",
  "transformers==4.41.2",
]

[project.scripts]
ctrl-api = "ctrl_v2.interfaces.http.app:run"
ctrl-intelligence-demo = "ctrl_v2.evaluation.product_intelligence_demo:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ctrl_v2"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["postgres: requires a real PostgreSQL instance"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.report]
fail_under = 85
show_missing = true
